name: adheronix-preview

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  TZ: Africa/Kigali
  DB_HOST: database
  DB_PORT: 5432
  DB_NAME: adheronix_preview
  DB_SSL: 'false'

services:
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: adheronix_preview
      POSTGRES_USER: adheronix_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate migration password}
    command: [postgres, -c, max_connections=30, -c, shared_buffers=64MB, -c, work_mem=4MB, -c, statement_timeout=15000]
    volumes: [adheronix_database:/var/lib/postgresql/data]
    networks: [database]
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U adheronix_migrator -d adheronix_preview']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  migrate:
    image: ${ADHERONIX_IMAGE:?Set the committed backend image}
    profiles: [tools]
    command: [node, backend-api/scripts/migrate.cjs]
    environment:
      <<: *api-env
      DB_USERNAME: adheronix_migrator
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate migration password}
      APP_DB_PASSWORD: ${ADHERONIX_DB_PASSWORD:?Set a random runtime password}
    networks: [database]
    depends_on:
      database: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=32m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging: *logging

  api:
    image: ${ADHERONIX_IMAGE:?Set the committed backend image}
    restart: unless-stopped
    environment:
      <<: *api-env
      DB_USERNAME: adheronix_api
      DB_PASSWORD: ${ADHERONIX_DB_PASSWORD:?Set a random runtime password}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT secret}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:?Set a separate admin setup key}
      SMARTBOX_API_KEY: ${SMARTBOX_API_KEY:-}
      SMARTBOX_DEVICE_PATIENT_MAP: ${SMARTBOX_DEVICE_PATIENT_MAP:-}
      SMARTBOX_DEMO_ENABLED: 'false'
      AGENT_MONITORING_ENABLED: 'false'
      AGENT_ALLOW_EMERGENCY_WEBHOOK: 'false'
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_PRIMARY_MODEL: ${GROQ_PRIMARY_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PRIMARY_MODEL: ${OPENROUTER_PRIMARY_MODEL:-openai/gpt-oss-20b}
    ports: ['127.0.0.1:3260:3000']
    networks: [database, outbound]
    depends_on:
      database: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=64m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    logging: *logging

networks:
  database: {internal: true}
  outbound: {}
volumes:
  adheronix_database: {}
